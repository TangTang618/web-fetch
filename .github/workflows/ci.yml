name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  worker:
    name: worker (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The point of this project is that it runs anywhere, so the tests run
        # on every platform a contributor is likely to develop on.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20", "22"]
        exclude:
          # One Node version per non-Linux runner is enough signal.
          - os: macos-latest
            node-version: "20"
          - os: windows-latest
            node-version: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
